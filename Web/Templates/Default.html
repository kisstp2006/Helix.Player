<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #status { position: absolute; left: 8px; bottom: 8px; color: #aaa; font: 12px monospace; white-space: pre-wrap; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status"></div>
  <script>
    var statusElement = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); statusElement.textContent = text; },
      setStatus: function (text) { statusElement.textContent = text; },
      onRuntimeInitialized: function () { statusElement.textContent = ''; }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
